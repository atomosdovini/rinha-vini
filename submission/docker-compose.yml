# Submission docker-compose for Rinha de Backend 2026.
# Pulls the prebuilt image from GHCR — no source or build context required.

services:
  lb:
    image: haproxy:2.9-alpine
    container_name: rinha-lb
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api-1
      - api-2
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "20MB"

  api-1: &api
    image: ghcr.io/atomosdovini/rinha-vini-api:latest
    container_name: rinha-api-1
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "165MB"

  api-2:
    <<: *api
    container_name: rinha-api-2

networks:
  rinha:
    driver: bridge

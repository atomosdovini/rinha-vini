# Local dev compose — builds the image locally and runs the full stack.
# The submission branch uses a stripped-down version that pulls from GHCR.
#
# The `index-init` service copies /opt/index.bin (baked into the image layer)
# into a named volume that both API replicas mount read-only. This guarantees
# both APIs mmap the *same* inode → the kernel keeps a single page-cache copy
# regardless of overlayfs behaviour.

services:
  index-init:
    # build:
      # context: .
      # dockerfile: api/Dockerfile
    image: ghcr.io/atomosdovini/rinha-vini-api:latest
    container_name: rinha-index-init
    entrypoint: ["/bin/sh","-c"]
    # dd with a small buffer to keep memory bounded; idempotent.
    command: ["if [ ! -s /data/index.bin ]; then dd if=/opt/index.bin of=/data/index.bin bs=1M conv=fsync status=none; fi"]
    volumes:
      - index_data:/data
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "60MB"

  lb:
    image: haproxy:2.9-alpine
    container_name: rinha-lb
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api-1
      - api-2
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"

  api-1: &api
    image: ghcr.io/atomosdovini/rinha-vini-api:latest
    container_name: rinha-api-1
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      INDEX_PATH: "/data/index.bin"
      WORKERS: "1"
    volumes:
      - index_data:/data:ro
    depends_on:
      index-init:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"

  api-2:
    <<: *api
    container_name: rinha-api-2

networks:
  rinha:
    driver: bridge

volumes:
  index_data:
